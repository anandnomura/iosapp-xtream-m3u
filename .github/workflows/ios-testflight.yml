name: iOS TestFlight

on:
  workflow_dispatch:

jobs:
  archive-and-upload:
    name: Archive And Upload
    runs-on: macos-15
    timeout-minutes: 45
    env:
      ARCHIVE_PATH: ${{ runner.temp }}/OneXtreamM3U.xcarchive
      EXPORT_PATH: ${{ runner.temp }}/export
      LOG_PATH: ${{ runner.temp }}/logs

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Prepare diagnostics folders
        run: |
          mkdir -p "$LOG_PATH" "$EXPORT_PATH"

      - name: Install signing assets
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: bash scripts/ci/install_signing_assets.sh

      - name: Prepare App Store Connect key
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY" > "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"

      - name: Archive app
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          xcodebuild \
            -project OneXtreamM3U.xcodeproj \
            -scheme OneXtreamM3U \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$ARCHIVE_PATH" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="com.bl.1xtream-m3u" \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$CI_PROFILE_NAME" \
            OTHER_CODE_SIGN_FLAGS="--keychain $CI_KEYCHAIN_PATH" \
            archive | tee "$LOG_PATH/archive.log"

      - name: Capture archive metadata
        run: |
          APP_INFO_PLIST="$ARCHIVE_PATH/Products/Applications/1xtream-m3u.app/Info.plist"
          APP_STORE_INFO_PLIST="$ARCHIVE_PATH/Info.plist"

          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_INFO_PLIST" | tee "$LOG_PATH/bundle_id.txt"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP_INFO_PLIST" | tee "$LOG_PATH/version.txt"
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP_INFO_PLIST" | tee "$LOG_PATH/build_number.txt"
          cp "$APP_INFO_PLIST" "$LOG_PATH/App-Info.plist"
          cp "$APP_STORE_INFO_PLIST" "$LOG_PATH/Archive-Info.plist"

      - name: Create export options
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash scripts/ci/write_export_options.sh

      - name: Export IPA
        run: |
          set -o pipefail
          xcodebuild \
            -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" | tee "$LOG_PATH/export.log"

      - name: Capture export metadata
        run: |
          cp "$RUNNER_TEMP/ExportOptions.plist" "$LOG_PATH/ExportOptions.plist"
          if [[ -f "$EXPORT_PATH/DistributionSummary.plist" ]]; then
            cp "$EXPORT_PATH/DistributionSummary.plist" "$LOG_PATH/DistributionSummary.plist"
          fi
          if [[ -f "$EXPORT_PATH/Packaging.log" ]]; then
            cp "$EXPORT_PATH/Packaging.log" "$LOG_PATH/Packaging.log"
          fi
          ls -lah "$EXPORT_PATH" | tee "$LOG_PATH/export-directory.txt"
          shasum -a 256 "$EXPORT_PATH/1xtream-m3u.ipa" | tee "$LOG_PATH/ipa-sha256.txt"

      - name: Upload to TestFlight
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          set -o pipefail
          xcrun iTMSTransporter \
            -m upload \
            -assetFile "$EXPORT_PATH/1xtream-m3u.ipa" \
            -apiKey "$APP_STORE_CONNECT_KEY_ID" \
            -apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" \
            -v informational | tee "$LOG_PATH/transporter-upload.log"

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 1xtream-m3u-ipa-${{ github.run_number }}
          path: ${{ env.EXPORT_PATH }}/1xtream-m3u.ipa
          if-no-files-found: error

      - name: Upload release diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 1xtream-m3u-diagnostics-${{ github.run_number }}
          path: ${{ env.LOG_PATH }}
          if-no-files-found: error
